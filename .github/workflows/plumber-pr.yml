name: Plumber PR gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: plumber-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plumber:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to Code Scanning
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false
      - uses: getplumber/plumber@v0.7.18
        with:
          version: v0.7.18
          min-points: 90

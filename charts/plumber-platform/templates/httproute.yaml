{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "plumber-platform.fullname" . }}
  labels:
    {{- include "plumber-platform.labels" . | nindent 4 }}
  {{- if or .Values.httpRoute.annotations .Values.additionalAnnotations }}
  annotations:
    {{- range $key, $val := .Values.httpRoute.annotations }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
    {{- range $key, $val := .Values.additionalAnnotations }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
  {{- end }}
{{- if empty .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs must name at least one Gateway when httpRoute.enabled is true" }}
{{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    # One origin: the browser calls /api same-origin, so both apps share the host.
    - {{ required "httpRoute.host is required when httpRoute.enabled is true" .Values.httpRoute.host | quote }}
  rules:
    {{- if .Values.backend.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.backend.name }}
          port: {{ .Values.backend.port }}
    {{- end }}
    {{- if .Values.front.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.front.name }}
          port: {{ .Values.front.port }}
    {{- end }}
{{- end }}

suite: bootstrap post-install job
templates:
  - job-bootstrap.yaml
values:
  - ./values/base.yaml
release:
  name: plumber
set:
  bootstrap.enabled: true
  bootstrap.gitlabUrl: https://gitlab.example.com
  bootstrap.clientId: app-id
  bootstrap.existingSecret: bootstrap-secret
tests:
  - it: is absent when disabled
    set:
      bootstrap.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a post-install hook job that waits for readyz then bootstraps
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: curlimages/curl:8.11.1
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: http://plumber-backend:8080/readyz
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^docker\.io/getplumber/platform-backend:v[0-9]+\.[0-9]+\.[0-9]+$
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/usr/local/bin/plumber-bootstrap", "-base-url", "https://gitlab.example.com", "-client-id", "app-id", "-scope", "instance"]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLUMBER_BOOTSTRAP_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: bootstrap-secret
                key: clientSecret
      # An instance scope still needs no access token from the bootstrap: the
      # key is declared optional, so a Secret without it leaves the variable
      # unset and an Admin sets the token in Settings, exactly as before. This
      # assertion used to be a blanket notContains, which also locked out the
      # group scope, where a token is MANDATORY (see the two tests below).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLUMBER_TOKEN_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: plumber-plumber-platform
                key: tokenEncryptionKey
  - it: passes the root group for a group scope
    set:
      bootstrap.scope: group
      bootstrap.rootGroup: my-company
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/usr/local/bin/plumber-bootstrap", "-base-url", "https://gitlab.example.com", "-client-id", "app-id", "-scope", "group", "-root-group", "my-company"]
  # plumber-bootstrap REFUSES a group scope with no token (it would store the
  # group unresolved, with nobody able to reach the settings API that would fix
  # it). The Job used to pass none, so every group-scope install rendered fine
  # and then failed at runtime, failing the release with it. Asserting the
  # rendered command alone is what let that through, so assert the env too.
  - it: requires the token from the secret for a group scope
    set:
      bootstrap.scope: group
      bootstrap.rootGroup: my-company
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLUMBER_BOOTSTRAP_TOKEN
            valueFrom:
              secretKeyRef:
                name: bootstrap-secret
                key: token
                optional: false
  - it: leaves the token optional for an instance scope
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLUMBER_BOOTSTRAP_TOKEN
            valueFrom:
              secretKeyRef:
                name: bootstrap-secret
                key: token
                optional: true
  - it: fails on a group scope without a root group
    set:
      bootstrap.scope: group
    asserts:
      - failedTemplate:
          errorPattern: bootstrap.rootGroup is required
  - it: fails without the existing secret
    set:
      bootstrap.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: bootstrap.existingSecret is required

suite: gateway api httproute
templates:
  - httproute.yaml
values:
  - ./values/base.yaml
release:
  name: plumber
tests:
  - it: is absent by default
    asserts:
      - hasDocuments:
          count: 0
  - it: routes /api to the backend and / to the frontend on one host, attached to the given Gateway
    set:
      httpRoute.enabled: true
      httpRoute.host: plumber.example.com
      httpRoute.parentRefs:
        - name: forge-gateway
          namespace: gateway-system
          sectionName: https
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: plumber-plumber-platform
      - equal:
          path: spec.hostnames
          value:
            - plumber.example.com
      - equal:
          path: spec.parentRefs
          value:
            - name: forge-gateway
              namespace: gateway-system
              sectionName: https
      - lengthEqual:
          path: spec.rules
          count: 2
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /api
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: plumber-backend
            port: 8080
      - equal:
          path: spec.rules[1].matches[0].path
          value:
            type: PathPrefix
            value: /
      - equal:
          path: spec.rules[1].backendRefs[0]
          value:
            name: plumber-front
            port: 3000
      - notExists:
          path: spec.tls
  - it: leaves only the backend rule when the frontend is disabled
    set:
      httpRoute.enabled: true
      httpRoute.host: plumber.example.com
      httpRoute.parentRefs:
        - name: forge-gateway
      front.enabled: false
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 1
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /api
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: plumber-backend
  - it: merges httpRoute and additional annotations
    set:
      httpRoute.enabled: true
      httpRoute.host: plumber.example.com
      httpRoute.parentRefs:
        - name: forge-gateway
      httpRoute.annotations:
        example.com/owner: forge
      additionalAnnotations:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: forge
      - equal:
          path: metadata.annotations.team
          value: platform
  - it: fails without a host
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: forge-gateway
    asserts:
      - failedTemplate:
          errorMessage: httpRoute.host is required when httpRoute.enabled is true
  - it: fails without a parentRef
    set:
      httpRoute.enabled: true
      httpRoute.host: plumber.example.com
      httpRoute.parentRefs: []
    asserts:
      - failedTemplate:
          errorMessage: httpRoute.parentRefs must name at least one Gateway when httpRoute.enabled is true
